name: Public package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check public files and reachable history
        run: python scripts/check_public_tree.py
      - name: Install test and build dependencies
        run: python -m pip install '.[ios,dev]'
      - name: Prepare isolated test directories
        run: |
          pogo_test_config_dir="$RUNNER_TEMP/pogo-test-config"
          pogo_test_state_dir="$RUNNER_TEMP/pogo-test-state"
          mkdir -p "$pogo_test_config_dir" "$pogo_test_state_dir"
          echo "POGO_CONFIG_DIR=$pogo_test_config_dir" >> "$GITHUB_ENV"
          echo "POGO_STATE_DIR=$pogo_test_state_dir" >> "$GITHUB_ENV"
      - name: Run synthetic regression suite
        run: python -m unittest discover -s tests -t .
      - name: Build wheel and source distribution
        run: python -m build
