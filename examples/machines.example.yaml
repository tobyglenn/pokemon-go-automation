# Copy to your private POGO_CONFIG_DIR and calibrate before running.
# A device's own `machine` field is only the fallback: the coordinator probes the
# USB buses and sends each named phone to the computer it is really plugged into.
machines:
  controller:
    hostnames:
    - YOUR_CONTROLLER_HOSTNAME
  worker:
    hostnames:
    - YOUR_WORKER_HOSTNAME
    ssh_host: YOUR_SSH_ALIAS
    project_dir: ~/pokemon-go-automation
    python: .venv/bin/python
    config_dir: ~/.config/pokemon-go-automation
